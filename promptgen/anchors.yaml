conditions:
  - zero_shot
  - translation
  - csicl

stages: [0, 25, 50, 75, 100]

stage_tolerance:
  0:   [0.00, 0.15]
  25:  [0.02, 0.45]
  50:  [0.10, 0.70]
  75:  [0.25, 0.92]
  100: [0.85, 1.00]

progression:
  min_step: 0.04
  min_span: 0.25