# Anchor / Input 레지스트리 — Global-MMLU 42개 언어
#
# [설계] 입력 언어는 42개 전부, anchor는 사람번역/post-edit 15개(영어 제외 14개)로 한정한다.
#   input  쪽 기계번역 잡음은 Zero-Shot 기저에도 동일하게 들어가 normalized gain이 일부 흡수한다.
#   anchor 쪽 기계번역은 데모 자체가 처치이고, MT 품질이 자원수준→영어와의 거리와 상관하므로
#   독립변수와 같은 축으로 오염된다. 그래서 anchor만 제한한다.
#
# [확인 필요] 사람번역 15개 목록은 Global-MMLU-Lite v1의 언어 집합(= MMMLU 14개 + 영어)으로
#   추정한 것이다. 데이터셋 카드에서 직접 확인한 뒤 exclude_from 을 확정할 것.
#
# [확인 필요] morphology / word_order 는 손으로 붙인 잠정값. 논문에는 WALS 20A/21A/22A 에서
#   재도출할 것. anchor 14개 것만 정확하면 되므로 부담은 크지 않다.
#
# exclude_from: [translation, csicl]  → 그 언어를 anchor로 쓰지 않는다. input 으로는 남는다.

# 문항 선별 — 데모 풀과 평가 세트를 나누는 규칙. itemsel.py 가 이 블록만 본다.
item_selection:
  filters:
    is_annotated: true                   # 문화 편향 연구 주석이 있는 문항만
    cultural_sensitivity_label: CA       # 문화 무관 문항만
  reference_lang: en                     # 필터를 적용할 기준 언어 split
  seed: 777                              # 기존 실험의 RANDOM_SEED 와 동일해야 함
  eval_n: 300                            # 셔플된 풀의 앞 300개 = 평가
  demo_pool_size: 20                     # 셔플된 풀의 뒤 20개 = 데모 추출용


# demos 는 반드시 위 데모 풀(마지막 20개) 안에 있어야 한다. 벗어나면 빌드가 중단된다.
# 비워두면 데모 풀 앞에서 5개를 자동 선택한다.
demos:
  - clinical_knowledge/test/65
  - high_school_mathematics/test/48
  - professional_medicine/test/169
  - medical_genetics/test/15
  - college_physics/test/20

source_language: English

anchors:

  # ── anchor + input : 사람번역/post-edit (14개, 영어 제외) ──────────────────
  - {code: ar,  name: Arabic,     morphology: templatic,     word_order: VSO, script: non-latin, resource: high, translation: human}
  - {code: bn,  name: Bengali,    morphology: fusional,      word_order: SOV, script: non-latin, resource: mid , translation: human}
  - {code: zh,  name: Chinese,    morphology: isolating,     word_order: SVO, script: non-latin, resource: high, translation: human}
  - {code: fr,  name: French,     morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: human}
  - {code: de,  name: German,     morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: human}
  - {code: hi,  name: Hindi,      morphology: fusional,      word_order: SOV, script: non-latin, resource: high, translation: human}
  - {code: id,  name: Indonesian, morphology: agglutinative, word_order: SVO, script: latin,     resource: mid , translation: human}
  - {code: it,  name: Italian,    morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: human}
  - {code: ja,  name: Japanese,   morphology: agglutinative, word_order: SOV, script: non-latin, resource: high, translation: human}
  - {code: ko,  name: Korean,     morphology: agglutinative, word_order: SOV, script: non-latin, resource: mid , translation: human}
  - {code: pt,  name: Portuguese, morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: human}
  - {code: es,  name: Spanish,    morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: human}
  - {code: sw,  name: Swahili,    morphology: agglutinative, word_order: SVO, script: latin,     resource: low , translation: human}
  - {code: yo,  name: Yoruba,     morphology: isolating,     word_order: SVO, script: latin,     resource: low , translation: human}

  # ── input 전용 : 영어 (source language 이므로 en->en 이 성립 안 함) ─────────
  - {code: en,  name: English,    morphology: analytic,      word_order: SVO, script: latin,     resource: high, translation: human,
     exclude_from: [translation, csicl]}

  # ── input 전용 : 기계번역 + 부분 post-edit (27개) ──────────────────────────
  - {code: am,  name: Amharic,    morphology: templatic,     word_order: SOV, script: non-latin, resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: cs,  name: Czech,      morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: nl,  name: Dutch,      morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: fil, name: Filipino,   morphology: agglutinative, word_order: VSO, script: latin,     resource: mid , translation: machine, exclude_from: [translation, csicl]}
  - {code: el,  name: Greek,      morphology: fusional,      word_order: SVO, script: non-latin, resource: mid , translation: machine, exclude_from: [translation, csicl]}
  - {code: ha,  name: Hausa,      morphology: isolating,     word_order: SVO, script: latin,     resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: he,  name: Hebrew,     morphology: templatic,     word_order: SVO, script: non-latin, resource: mid , translation: machine, exclude_from: [translation, csicl]}
  - {code: ig,  name: Igbo,       morphology: isolating,     word_order: SVO, script: latin,     resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: ky,  name: Kyrgyz,     morphology: agglutinative, word_order: SOV, script: non-latin, resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: lt,  name: Lithuanian, morphology: fusional,      word_order: SVO, script: latin,     resource: mid , translation: machine, exclude_from: [translation, csicl]}
  - {code: mg,  name: Malagasy,   morphology: agglutinative, word_order: VOS, script: latin,     resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: ms,  name: Malay,      morphology: agglutinative, word_order: SVO, script: latin,     resource: mid , translation: machine, exclude_from: [translation, csicl]}
  - {code: ne,  name: Nepali,     morphology: fusional,      word_order: SOV, script: non-latin, resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: ny,  name: Chichewa,   morphology: agglutinative, word_order: SVO, script: latin,     resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: fa,  name: Persian,    morphology: fusional,      word_order: SOV, script: non-latin, resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: pl,  name: Polish,     morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: ro,  name: Romanian,   morphology: fusional,      word_order: SVO, script: latin,     resource: mid , translation: machine, exclude_from: [translation, csicl]}
  - {code: ru,  name: Russian,    morphology: fusional,      word_order: SVO, script: non-latin, resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: sr,  name: Serbian,    morphology: fusional,      word_order: SVO, script: non-latin, resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: sn,  name: Shona,      morphology: agglutinative, word_order: SVO, script: latin,     resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: si,  name: Sinhala,    morphology: agglutinative, word_order: SOV, script: non-latin, resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: so,  name: Somali,     morphology: agglutinative, word_order: SOV, script: latin,     resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: sv,  name: Swedish,    morphology: fusional,      word_order: SVO, script: latin,     resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: te,  name: Telugu,     morphology: agglutinative, word_order: SOV, script: non-latin, resource: low , translation: machine, exclude_from: [translation, csicl]}
  - {code: tr,  name: Turkish,    morphology: agglutinative, word_order: SOV, script: latin,     resource: high, translation: machine, exclude_from: [translation, csicl]}
  - {code: uk,  name: Ukrainian,  morphology: fusional,      word_order: SVO, script: non-latin, resource: mid , translation: machine, exclude_from: [translation, csicl]}
  - {code: vi,  name: Vietnamese, morphology: isolating,     word_order: SVO, script: latin,     resource: high, translation: machine, exclude_from: [translation, csicl]}

conditions:
  - zero_shot
  - translation
  - csicl

stages: [0, 25, 50, 75, 100]

# 개별 단계의 느슨한 상식 검사용. 실제 판정은 progression(단조증가+간격)이 한다.
# MLF 조건상 기능형태소가 유지되므로 측정 비율은 명목 퍼센트보다 항상 낮게 나온다.
stage_tolerance:
  0:   [0.00, 0.15]
  25:  [0.02, 0.45]
  50:  [0.10, 0.70]
  75:  [0.25, 0.92]
  100: [0.85, 1.00]

# 점진적 전환으로 인정할 조건
progression:
  min_step: 0.04     # 인접 단계 간 최소 증가폭
  min_span: 0.25     # 25%~75% 전체 최소 폭